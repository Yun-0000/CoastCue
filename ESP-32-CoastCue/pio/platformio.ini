; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = boat

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib @ 7.7.1
  bblanchon/ArduinoJson @ 7.4.2

[common]
lora_cn_build_flags =
  -DCOASTCUE_REGION_CN
  -DCOASTCUE_LORA_RADIO_SX1278=1
  -DCOASTCUE_LORA_FREQUENCY_MHZ=433.0
  -DCOASTCUE_LORA_TX_POWER_DBM=10
  -DCOASTCUE_LORA_SPREADING_FACTOR=11
  -DCOASTCUE_LORA_CODING_RATE=8
lora_us_build_flags =
  -DCOASTCUE_REGION_US
  -DCOASTCUE_LORA_RADIO_SX1278=0
  -DCOASTCUE_LORA_FREQUENCY_MHZ=915.0
  -DCOASTCUE_LORA_TX_POWER_DBM=17
  -DCOASTCUE_LORA_SPREADING_FACTOR=9
  -DCOASTCUE_LORA_CODING_RATE=7

; The shore gateway shares the radio dependency but keeps the T-Beam's GPS and
; PMU libraries out of its build. Its local runtime has its own dependencies.
[env:boat-base]
extends = env
lib_deps =
  ${env.lib_deps}
  mikalhart/TinyGPSPlus @ 1.1.0
  lewisxhe/XPowersLib @ 0.3.3

[env:boat-tbeam]
extends = env:boat-base
build_flags =
  -DCOASTCUE_ROLE_BOAT
  -DCOASTCUE_BOARD_PROFILE=COASTCUE_BOARD_TBEAM_SX127X

[env:boat-cn]
extends = env:boat-tbeam
build_flags =
  ${env:boat-tbeam.build_flags}
  ${common.lora_cn_build_flags}
  -DCOASTCUE_TBEAM_PMU=COASTCUE_TBEAM_PMU_AXP2101

; Bench-only profile: the first Incident snapshot succeeds, the next write
; fails once, and the following replay/retry may recover. Never use in field.
[env:boat-cn-fault-nvs]
extends = env:boat-cn
build_flags =
  ${env:boat-cn.build_flags}
  -DCOASTCUE_BENCH_BOAT_PERSIST_FAIL_AFTER_SUCCESSES=1
  -DCOASTCUE_BENCH_BOAT_PERSIST_FAILURE_COUNT=1

; Locked 433 MHz field profile for the boat's wired SSD1306. The panel height
; remains deployment-local in coastcue_config.h (32 or 64 pixels).
[env:boat-cn-oled]
extends = env:boat-cn
lib_deps =
  ${env:boat-base.lib_deps}
  adafruit/Adafruit BusIO @ 1.17.4
  adafruit/Adafruit GFX Library @ 1.12.6
  adafruit/Adafruit SSD1306 @ 2.5.17
build_flags =
  ${env:boat-cn.build_flags}
  -DCOASTCUE_OLED_ENABLED=1

; Temporary bench/range diagnostic. It changes GPS probing and sends diagnostic
; reports every 15 seconds, so it must not be left on the field boat.
[env:boat-cn-gps-diagnostic]
extends = env:boat-tbeam
build_flags =
  ${env:boat-tbeam.build_flags}
  ${common.lora_cn_build_flags}
  -DCOASTCUE_TBEAM_PMU=COASTCUE_TBEAM_PMU_AXP2101
  -DCOASTCUE_GPS_DIAGNOSTICS=1
  -DCOASTCUE_GPS_DIAGNOSTIC_REPORT_PERIOD_MS=15000UL

[env:boat-cn-axp192]
extends = env:boat-tbeam
build_flags =
  ${env:boat-tbeam.build_flags}
  ${common.lora_cn_build_flags}
  -DCOASTCUE_TBEAM_PMU=COASTCUE_TBEAM_PMU_AXP192

[env:boat-us-axp192]
extends = env:boat-tbeam
build_flags =
  ${env:boat-tbeam.build_flags}
  ${common.lora_us_build_flags}
  -DCOASTCUE_TBEAM_PMU=COASTCUE_TBEAM_PMU_AXP192

[env:shore-base]
extends = env
board_build.filesystem = littlefs
lib_deps =
  ${env.lib_deps}
  h2zero/NimBLE-Arduino @ 2.3.6
  adafruit/Adafruit BusIO @ 1.17.4
  adafruit/Adafruit GFX Library @ 1.12.6
  adafruit/Adafruit SH110X @ 2.1.12

[env:shore-gateway]
extends = env:shore-base
build_flags =
  -DCOASTCUE_ROLE_SHORE
  -DCOASTCUE_BOARD_PROFILE=COASTCUE_BOARD_DEVKIT_RA02
  -DCOASTCUE_OLED_ENABLED=1
  -DCOASTCUE_OLED_HEIGHT=64

[env:shore-cn]
extends = env:shore-gateway
build_flags =
  ${env:shore-gateway.build_flags}
  ${common.lora_cn_build_flags}

; Bench-only profile: the first operator Ack/Resolve journal append fails and
; storage remains unavailable for that boot. Normal telemetry cannot consume
; the injection. Never use in field.
[env:shore-cn-fault-littlefs]
extends = env:shore-cn
build_flags =
  ${env:shore-cn.build_flags}
  -DCOASTCUE_BENCH_SHORE_FAIL_FIRST_OPERATOR_TRANSITION=1

[env:boat-us]
extends = env:boat-tbeam
build_flags =
  ${env:boat-tbeam.build_flags}
  ${common.lora_us_build_flags}
  -DCOASTCUE_TBEAM_PMU=COASTCUE_TBEAM_PMU_AXP2101

[env:shore-us]
extends = env:shore-gateway
build_flags =
  ${env:shore-gateway.build_flags}
  ${common.lora_us_build_flags}

[env:boat]
extends = env:boat-cn-oled

[env:shore]
extends = env:shore-cn
