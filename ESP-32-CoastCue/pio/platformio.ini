[platformio]
default_envs = boat

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib @ 7.7.1
  bblanchon/ArduinoJson @ 7.4.2

[region]
us =
  -DCOASTCUE_LORA_FREQUENCY_MHZ=915.0
  -DCOASTCUE_LORA_BANDWIDTH_KHZ=500.0
  -DCOASTCUE_LORA_TX_POWER_DBM=13
  -DCOASTCUE_LORA_SPREADING_FACTOR=9
  -DCOASTCUE_LORA_CODING_RATE=7

; T-Beam SX1276/AXP2101 with its 128x64 SSD1306.
[env:boat]
lib_deps =
  ${env.lib_deps}
  mikalhart/TinyGPSPlus @ 1.1.0
  lewisxhe/XPowersLib @ 0.3.3
  adafruit/Adafruit BusIO @ 1.17.4
  adafruit/Adafruit GFX Library @ 1.12.6
  adafruit/Adafruit SSD1306 @ 2.5.17
build_flags =
  -DCOASTCUE_ROLE_BOAT
  -DCOASTCUE_BOARD_PROFILE=COASTCUE_BOARD_TBEAM_SX127X
  ${region.us}

; LilyGO T3 V1.6.1 (TTGO LoRa32 V2.1_1.6): radio and 128x64 SSD1306 on board.
[env:shore]
board_build.filesystem = littlefs
lib_deps =
  ${env.lib_deps}
  h2zero/NimBLE-Arduino @ 2.3.6
  adafruit/Adafruit BusIO @ 1.17.4
  adafruit/Adafruit GFX Library @ 1.12.6
  adafruit/Adafruit SSD1306 @ 2.5.17
build_flags =
  -DCOASTCUE_ROLE_SHORE
  -DCOASTCUE_BOARD_PROFILE=COASTCUE_BOARD_LILYGO_T3_V1_6
  ${region.us}
