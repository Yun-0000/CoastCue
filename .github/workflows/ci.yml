name: CoastCue checks

on:
  push:
    branches: [us, cn]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coastcue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - uses: actions/cache@v4
        with:
          path: .tooling/platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('requirements-tools.txt', 'ESP-32-CoastCue/pio/platformio.ini') }}
      - run: make tooling ci-test-config
      - run: make check-host

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make ios-test
